<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — STELCO Debtors Reconciliation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">S</div>
      <div>
        <div class="brand-name">STELCO</div>
        <div class="brand-sub">Debtors Reconciliation System</div>
      </div>
    </div>

    <h1 class="login-title">Sign in</h1>
    <p class="login-desc">Customer Services &amp; Billing Department</p>

    <form id="loginForm" class="login-form" autocomplete="on">
      <div class="field-group wide" style="max-width:none;">
        <label class="field-label" for="username">Username</label>
        <input class="field-input" type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field-group wide" style="max-width:none;">
        <label class="field-label" for="password">Password</label>
        <input class="field-input" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <button class="btn-primary login-btn" type="submit" id="loginBtn">
        <span id="loginBtnText">Sign in</span>
      </button>

      <p class="error-msg" id="loginError" style="display:none"></p>
    </form>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  const API_URL = "https://stelco-recon-api.onrender.com";

  // Already signed in? Skip straight past the login screen.
  if (Auth.getToken()) window.location.replace("index.html");

  const form   = document.getElementById("loginForm");
  const btn    = document.getElementById("loginBtn");
  const btnTxt = document.getElementById("loginBtnText");
  const errEl  = document.getElementById("loginError");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errEl.style.display = "none";
    btn.disabled = true;
    btnTxt.textContent = "Signing in…";

    const body = new FormData();
    body.append("username", document.getElementById("username").value.trim());
    body.append("password", document.getElementById("password").value);

    try {
      const res = await fetch(`${API_URL}/login`, {
        method: "POST",
        body,
        signal: AbortSignal.timeout(90000), // Render free tier can take ~60s to wake up
      });
      if (!res.ok) {
        const msg = await res.text();
        throw new Error(res.status === 401 ? "Incorrect username or password." : msg);
      }
      const data = await res.json();
      Auth.setSession(data.access_token, data.username);
      window.location.replace("index.html");
    } catch (err) {
      errEl.textContent = err.message || "Sign in failed. Please try again.";
      errEl.style.display = "block";
    } finally {
      btn.disabled = false;
      btnTxt.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
